name: lint

# Lints and renders every blueprint chart on pull requests, and validates that each chart's
# values.yaml satisfies its values.schema.json (the schema that drives the Composition CRD).
on:
  pull_request:
    paths:
      - "blueprints/**"
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/lint.yaml"
  # Every commit on main, with no paths filter: release-tag.yaml refuses to release a commit with
  # no successful lint run (krateo-blueprints/charts PUBLISHING.md rule 10), and a merge commit is
  # not the pull request's head, so only a run on main itself can satisfy it.
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp a temporary chart version
        run: |
          find blueprints -name Chart.yaml -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template (validates values.schema.json) + lint
        run: |
          set -euo pipefail
          shopt -s nullglob
          rc=0
          for chart in blueprints/*/*/chart; do
            echo "::group::${chart}"
            # `helm template` is the authoritative gate: it renders the manifest AND enforces
            # values.schema.json against values.yaml. It fails the build.
            helm template release "${chart}" >/dev/null || rc=1
            # `helm lint` is informational only: its built-in Kubernetes-Kind heuristics produce
            # false positives on CRD-backed custom resources whose Kind collides with a core kind
            # (e.g. the ACK apigateway "Deployment"), so it must not fail the build.
            helm lint "${chart}" || true
            echo "::endgroup::"
          done
          exit $rc

  # The generator re-derives the Composition plural that plumbing/crdgen stamps and
  # core-provider reads back from discovery. A divergence breaks no build and fails no render --
  # it ships a customform that 404s. tools/ackgen/plural_test.go asserts the derivation AND
  # every plural already committed under blueprints/, so it has to actually run.
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/ackgen/go.mod
      - name: go test
        working-directory: tools/ackgen
        run: go test ./...

  # krateo-blueprints/charts PUBLISHING.md, checked on every change rather than first at release,
  # where a refusal comes after GHCR already holds the version. Above all: every committed
  # CompositionDefinition carries the CHART_VERSION placeholder; these once drifted to a literal
  # 0.1.1 that the release's stamp passed through unchanged. release-tag.yaml runs the same script
  # again, and then over the packaged archives.
  publishing-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: The committed charts follow the publishing standard
        run: python3 .github/scripts/publishing-gate.py tree .
