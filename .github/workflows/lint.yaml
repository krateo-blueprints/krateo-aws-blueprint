name: lint

# Lints and renders every blueprint chart on pull requests, and validates that each chart's
# values.yaml satisfies its values.schema.json (the schema that drives the Composition CRD).
on:
  pull_request:
    paths:
      - "blueprints/**"
      - "docs/**"
      - "examples/**"
      - "README.md"
      - ".github/workflows/lint.yaml"
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp a temporary chart version
        run: |
          find blueprints -name Chart.yaml -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template (validates values.schema.json) + lint
        run: |
          set -euo pipefail
          shopt -s nullglob
          rc=0
          for chart in blueprints/*/*/chart; do
            echo "::group::${chart}"
            # `helm template` is the authoritative gate: it renders the manifest AND enforces
            # values.schema.json against values.yaml. It fails the build.
            helm template release "${chart}" >/dev/null || rc=1
            # `helm lint` is informational only: its built-in Kubernetes-Kind heuristics produce
            # false positives on CRD-backed custom resources whose Kind collides with a core kind
            # (e.g. the ACK apigateway "Deployment"), so it must not fail the build.
            helm lint "${chart}" || true
            echo "::endgroup::"
          done
          exit $rc
