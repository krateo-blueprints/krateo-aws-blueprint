apiVersion: v2
# Krateo "complex" blueprint replicating the terraform-aws-modules/rds/aws module as a
# composition of native ACK rds resources (DBSubnetGroup + DBInstance + optional
# DBParameterGroup), wired via ACK *Ref fields.
#
# The Composition spec uses the SAME input names as the Terraform module (identifier, engine,
# instance_class, allocated_storage, subnet_ids, vpc_security_group_ids, parameters, tags, ...)
# — a curated CORE subset of the module's inputs (the module has 100+; see values.schema.json).
#
# Composition Kind: AwsRdsStack (plural awsrdsstacks) in composition.krateo.io.
name: aws-rds-stack
description: A Krateo composite blueprint that provisions an AWS RDS database (DB subnet group, DB instance and optional DB parameter group) via the ACK rds controller. Inputs mirror terraform-aws-modules/rds/aws. Requires the ACK rds controller and AWS credentials (see repo docs).
type: application

# Drives the Composition CRD version (0.3.0 -> v0-3-0). Stamped by CI.
version: CHART_VERSION
# Terraform module version whose input interface this mirrors.
appVersion: "tfmod-7.2.0"

home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - aws
  - rds
  - database
  - ack
  - stack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
  - https://registry.terraform.io/modules/terraform-aws-modules/rds/aws
annotations:
  krateo.io/category: "database"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
