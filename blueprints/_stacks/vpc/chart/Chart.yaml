apiVersion: v2
# Krateo "complex" blueprint replicating the terraform-aws-modules/vpc/aws module as a
# composition of native ACK ec2 resources (VPC + public/private Subnets + RouteTables + Routes
# + InternetGateway + ElasticIPAddress + NATGateway), wired via ACK *Ref fields.
#
# The Composition spec uses the SAME input names as the Terraform module (cidr, azs,
# public_subnets, private_subnets, enable_nat_gateway, single_nat_gateway, tags, ...) — a
# curated subset of the module's inputs (the module has 200+; see values.schema.json).
#
# Composition Kind: AwsVpcStack (plural awsvpcstacks) in composition.krateo.io.
name: aws-vpc-stack
description: A Krateo composite blueprint that provisions an AWS VPC (subnets, route tables, internet gateway, NAT) via the ACK ec2 controller. Inputs mirror terraform-aws-modules/vpc/aws. Requires the ACK ec2 controller and AWS credentials (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# Terraform module version whose input interface this mirrors.
appVersion: "tfmod-6.6.1"

home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - aws
  - vpc
  - ec2
  - ack
  - network
  - stack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
  - https://registry.terraform.io/modules/terraform-aws-modules/vpc/aws
annotations:
  krateo.io/category: "network"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
