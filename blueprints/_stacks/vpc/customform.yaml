apiVersion: v1
data:
  drawer: "true"
  form: "true"
  showFormStructure: "true"
  drawerSize: large
kind: ConfigMap
metadata:
  name: template-aws-vpc-stack-card
  namespace: aws-vpc-system
---
apiVersion: templates.krateo.io/v1alpha1
kind: Widget
metadata:
  name: template-aws-vpc-stack-card
  namespace: aws-vpc-system
spec:
  actions:
  - template:
      apiVersion: templates.krateo.io/v1alpha1
      name: template-aws-vpc-stack-customform
      namespace: aws-vpc-system
      resource: customforms
      verb: GET
  - template:
      apiVersion: core.krateo.io/v1alpha1
      name: aws-vpc-stack
      namespace: aws-vpc-system
      resource: compositiondefinitions
      verb: DELETE
  app:
    template:
      color: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | if .status == "False" then "orange" elif .status == "True" then "green" else "grey" end }
      content: Provision an AWS VPC (subnets, route tables, IGW, NAT) — inputs mirror terraform-aws-modules/vpc/aws.
      icon: fa-solid fa-network-wired
      tags: aws-vpc-system,0.2.0
      title: aws-vpc-stack
      status: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | "Ready:" + .status }
      date: ${ .getCompositionDefinition.metadata.creationTimestamp }
  propsRef:
    name: template-aws-vpc-stack-card
    namespace: aws-vpc-system
  type: card
  api:
  - name: getCompositionDefinition
    path: "/apis/core.krateo.io/v1alpha1/namespaces/aws-vpc-system/compositiondefinitions/aws-vpc-stack"
    verb: GET
    headers:
    - 'Accept: application/json'
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: template-aws-vpc-stack-customform
  namespace: aws-vpc-system
data:
  onSubmitId: submit
  onSubmitVerb: POST
  payloadFormKey: spec
  redirectRoute: /compositions/${metadata.namespace}/${metadata.name}
  redirectTimeout: "50"
---
apiVersion: templates.krateo.io/v1alpha1
kind: CustomForm
metadata:
  name: template-aws-vpc-stack-customform
  namespace: aws-vpc-system
spec:
  type: customform
  propsRef:
    name: template-aws-vpc-stack-customform
    namespace: aws-vpc-system
  actions:
    - template:
        id: submit
        apiVersion: composition.krateo.io/v0-2-0
        verb: POST
        resource: awsvpcstacks
        payloadToOverride:
        - name: metadata.namespace
          value: ${ "aws-vpc-system" }
  app:
    template:
      schema: ${ .getCRD | .spec.versions[] | select(.name == "v0-2-0") | .schema.openAPIV3Schema.properties.spec }
  api:
  - name: getCRD
    path: "/apis/apiextensions.k8s.io/v1/customresourcedefinitions/awsvpcstacks.composition.krateo.io"
    verb: GET
    headers:
    - 'Accept: application/json'
