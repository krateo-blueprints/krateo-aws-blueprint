apiVersion: v2
# Generated by tools/ackgen from the ACK Certificate CRD (acmpca.services.k8s.aws).
#
# Renders a native acmpca.services.k8s.aws/v1alpha1 Certificate resource; the ACK acmpca
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsAcmpcaCertificate (plural awsacmpcacertificates) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Certificate spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-acmpca-certificate
description: A Krateo blueprint that provisions an AWS Acmpca Certificate via the AWS Controllers for Kubernetes (ACK) acmpca controller. Requires the ACK acmpca controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - acmpca
  - certificate
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "security"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
