apiVersion: v2
# Generated by tools/ackgen from the ACK Integration CRD (apigatewayv2.services.k8s.aws).
#
# Renders a native apigatewayv2.services.k8s.aws/v1alpha1 Integration resource; the ACK apigatewayv2
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsApigatewayv2Integration (plural awsapigatewayv2integrations) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Integration spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-apigatewayv2-integration
description: A Krateo blueprint that provisions an AWS Apigatewayv2 Integration via the AWS Controllers for Kubernetes (ACK) apigatewayv2 controller. Requires the ACK apigatewayv2 controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - aws
  - apigatewayv2
  - integration
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "network"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
