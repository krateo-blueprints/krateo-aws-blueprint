apiVersion: v2
# Generated by tools/ackgen from the ACK BackupPlan CRD (backup.services.k8s.aws).
#
# Renders a native backup.services.k8s.aws/v1alpha1 BackupPlan resource; the ACK backup
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsBackupBackupplan (plural awsbackupbackupplans) in the composition.krateo.io group.
# The Composition spec mirrors the ACK BackupPlan spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-backup-backupplan
description: A Krateo blueprint that provisions an AWS Backup BackupPlan via the AWS Controllers for Kubernetes (ACK) backup controller. Requires the ACK backup controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - aws
  - backup
  - backupplan
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
