apiVersion: v2
# Generated by tools/ackgen from the ACK BackupVault CRD (backup.services.k8s.aws).
#
# Renders a native backup.services.k8s.aws/v1alpha1 BackupVault resource; the ACK backup
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsBackupBackupvault (plural awsbackupbackupvaults) in the composition.krateo.io group.
