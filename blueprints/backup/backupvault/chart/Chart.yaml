name: aws-backup-backupvault
description: A Krateo blueprint that provisions an AWS Backup BackupVault via the AWS Controllers for Kubernetes (ACK) backup controller. Requires the ACK backup controller and AWS credentials to be installed/configured beforehand (see repo docs).
