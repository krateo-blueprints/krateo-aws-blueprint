name: aws-cloudwatchlogs-loggroup
description: A Krateo blueprint that provisions an AWS Cloudwatchlogs LogGroup via the AWS Controllers for Kubernetes (ACK) cloudwatchlogs controller. Requires the ACK cloudwatchlogs controller and AWS credentials to be installed/configured beforehand (see repo docs).
