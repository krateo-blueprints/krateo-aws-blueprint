apiVersion: v2
# Generated by tools/ackgen from the ACK LogGroup CRD (cloudwatchlogs.services.k8s.aws).
#
# Renders a native cloudwatchlogs.services.k8s.aws/v1alpha1 LogGroup resource; the ACK cloudwatchlogs
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsCloudwatchlogsLoggroup (plural awscloudwatchlogsloggroups) in the composition.krateo.io group.
