apiVersion: v2
# Generated by tools/ackgen from the ACK DBInstance CRD (documentdb.services.k8s.aws).
#
# Renders a native documentdb.services.k8s.aws/v1alpha1 DBInstance resource; the ACK documentdb
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsDocumentdbDbinstance (plural awsdocumentdbdbinstances) in the composition.krateo.io group.
# The Composition spec mirrors the ACK DBInstance spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-documentdb-dbinstance
description: A Krateo blueprint that provisions an AWS Documentdb DBInstance via the AWS Controllers for Kubernetes (ACK) documentdb controller. Requires the ACK documentdb controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - documentdb
  - dbinstance
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "database"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
