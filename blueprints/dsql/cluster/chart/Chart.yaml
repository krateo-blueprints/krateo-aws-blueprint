apiVersion: v2
# Generated by tools/ackgen from the ACK Cluster CRD (dsql.services.k8s.aws).
#
# Renders a native dsql.services.k8s.aws/v1alpha1 Cluster resource; the ACK dsql
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsDsqlCluster (plural awsdsqlclusters) in the composition.krateo.io group.
