name: aws-dsql-cluster
description: A Krateo blueprint that provisions an AWS Dsql Cluster via the AWS Controllers for Kubernetes (ACK) dsql controller. Requires the ACK dsql controller and AWS credentials to be installed/configured beforehand (see repo docs).
