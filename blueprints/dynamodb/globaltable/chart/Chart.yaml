apiVersion: v2
# Generated by tools/ackgen from the ACK GlobalTable CRD (dynamodb.services.k8s.aws).
#
# Renders a native dynamodb.services.k8s.aws/v1alpha1 GlobalTable resource; the ACK dynamodb
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsDynamodbGlobaltable (plural awsdynamodbglobaltables) in the composition.krateo.io group.
# The Composition spec mirrors the ACK GlobalTable spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-dynamodb-globaltable
description: A Krateo blueprint that provisions an AWS Dynamodb GlobalTable via the AWS Controllers for Kubernetes (ACK) dynamodb controller. Requires the ACK dynamodb controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - aws
  - dynamodb
  - globaltable
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
