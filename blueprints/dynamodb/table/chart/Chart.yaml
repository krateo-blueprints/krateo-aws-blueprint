apiVersion: v2
# Generated by tools/ackgen from the ACK Table CRD (dynamodb.services.k8s.aws).
#
# Renders a native dynamodb.services.k8s.aws/v1alpha1 Table resource; the ACK dynamodb
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsDynamodbTable (plural awsdynamodbtables) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Table spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-dynamodb-table
description: A Krateo blueprint that provisions an AWS Dynamodb Table via the AWS Controllers for Kubernetes (ACK) dynamodb controller. Requires the ACK dynamodb controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - dynamodb
  - table
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "database"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
