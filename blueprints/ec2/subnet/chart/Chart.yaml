apiVersion: v2
# Generated by tools/ackgen from the ACK Subnet CRD (ec2.services.k8s.aws).
#
# Renders a native ec2.services.k8s.aws/v1alpha1 Subnet resource; the ACK ec2
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsEc2Subnet (plural awsec2subnets) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Subnet spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-ec2-subnet
description: A Krateo blueprint that provisions an AWS Ec2 Subnet via the AWS Controllers for Kubernetes (ACK) ec2 controller. Requires the ACK ec2 controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - aws
  - ec2
  - subnet
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
