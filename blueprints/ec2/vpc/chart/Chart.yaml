apiVersion: v2
# Generated by tools/ackgen from the ACK VPC CRD (ec2.services.k8s.aws).
#
# Renders a native ec2.services.k8s.aws/v1alpha1 VPC resource; the ACK ec2
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsEc2Vpc (plural awsec2vpcs) in the composition.krateo.io group.
# The Composition spec mirrors the ACK VPC spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-ec2-vpc
description: A Krateo blueprint that provisions an AWS Ec2 VPC via the AWS Controllers for Kubernetes (ACK) ec2 controller. Requires the ACK ec2 controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - ec2
  - vpc
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "network"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
