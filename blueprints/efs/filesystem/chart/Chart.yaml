apiVersion: v2
# Generated by tools/ackgen from the ACK FileSystem CRD (efs.services.k8s.aws).
#
# Renders a native efs.services.k8s.aws/v1alpha1 FileSystem resource; the ACK efs
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsEfsFilesystem (plural awsefsfilesystems) in the composition.krateo.io group.
# The Composition spec mirrors the ACK FileSystem spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-efs-filesystem
description: A Krateo blueprint that provisions an AWS Efs FileSystem via the AWS Controllers for Kubernetes (ACK) efs controller. Requires the ACK efs controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - efs
  - filesystem
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "storage"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
