name: aws-elbv2-loadbalancer
description: A Krateo blueprint that provisions an AWS Elbv2 LoadBalancer via the AWS Controllers for Kubernetes (ACK) elbv2 controller. Requires the ACK elbv2 controller and AWS credentials to be installed/configured beforehand (see repo docs).
