apiVersion: v2
# Generated by tools/ackgen from the ACK LoadBalancer CRD (elbv2.services.k8s.aws).
#
# Renders a native elbv2.services.k8s.aws/v1alpha1 LoadBalancer resource; the ACK elbv2
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsElbv2Loadbalancer (plural awselbv2loadbalancers) in the composition.krateo.io group.
