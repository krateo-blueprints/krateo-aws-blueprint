{{- /*
Renders a native ACK TargetGroup custom resource from the Composition spec.

The Composition spec (.Values) mirrors the ACK TargetGroup spec, so it passes through verbatim.
`region` is Krateo-wiring (not part of the ACK spec) and becomes the standard ACK region
annotation. Generated by tools/ackgen.
*/ -}}
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: TargetGroup
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-elbv2-targetgroup.labels" . | nindent 4 }}
  {{- with .Values.region }}
  annotations:
    services.k8s.aws/region: {{ . | quote }}
  {{- end }}
{{- $spec := omit .Values "region" }}
{{- if $spec }}
spec:
{{ toYaml $spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}
