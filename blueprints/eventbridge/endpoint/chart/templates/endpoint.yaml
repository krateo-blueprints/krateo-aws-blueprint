{{- /*
Renders a native ACK Endpoint custom resource from the Composition spec.

The Composition spec (.Values) mirrors the ACK Endpoint spec, so it passes through verbatim.
`region` is Krateo-wiring (not part of the ACK spec) and becomes the standard ACK region
annotation. `global` (injected by Krateo/Helm) is omitted so it never leaks into the ACK spec.
Generated by tools/ackgen.
*/ -}}
apiVersion: eventbridge.services.k8s.aws/v1alpha1
kind: Endpoint
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-eventbridge-endpoint.labels" . | nindent 4 }}
  {{- with .Values.region }}
  annotations:
    services.k8s.aws/region: {{ . | quote }}
  {{- end }}
{{- $spec := omit .Values "region" "global" }}
{{- if $spec }}
spec:
{{ toYaml $spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}
