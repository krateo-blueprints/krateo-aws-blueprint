apiVersion: v2
# Generated by tools/ackgen from the ACK Role CRD (iam.services.k8s.aws).
#
# Renders a native iam.services.k8s.aws/v1alpha1 Role resource; the ACK iam
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsIamRole (plural awsiamroles) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Role spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-iam-role
description: A Krateo blueprint that provisions an AWS Iam Role via the AWS Controllers for Kubernetes (ACK) iam controller. Requires the ACK iam controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - iam
  - role
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateo.io/category: "security"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
