apiVersion: v2
# Generated by tools/ackgen from the ACK User CRD (iam.services.k8s.aws).
#
# Renders a native iam.services.k8s.aws/v1alpha1 User resource; the ACK iam
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsIamUser (plural awsiamusers) in the composition.krateo.io group.
