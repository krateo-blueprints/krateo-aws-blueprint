name: aws-iam-user
description: A Krateo blueprint that provisions an AWS Iam User via the AWS Controllers for Kubernetes (ACK) iam controller. Requires the ACK iam controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
