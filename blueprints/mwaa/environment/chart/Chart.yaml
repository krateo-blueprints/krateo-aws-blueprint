apiVersion: v2
# Generated by tools/ackgen from the ACK Environment CRD (mwaa.services.k8s.aws).
#
# Renders a native mwaa.services.k8s.aws/v1alpha1 Environment resource; the ACK mwaa
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsMwaaEnvironment (plural awsmwaaenvironments) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Environment spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-mwaa-environment
description: A Krateo blueprint that provisions an AWS Mwaa Environment via the AWS Controllers for Kubernetes (ACK) mwaa controller. Requires the ACK mwaa controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - mwaa
  - environment
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "application"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
