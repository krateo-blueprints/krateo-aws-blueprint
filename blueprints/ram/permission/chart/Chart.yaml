apiVersion: v2
# Generated by tools/ackgen from the ACK Permission CRD (ram.services.k8s.aws).
#
# Renders a native ram.services.k8s.aws/v1alpha1 Permission resource; the ACK ram
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRAMPermission (plural awsrampermissions) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Permission spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-ram-permission
description: A Krateo blueprint that provisions an AWS Ram Permission via the AWS Controllers for Kubernetes (ACK) ram controller. Requires the ACK ram controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - aws
  - ram
  - permission
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "security"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
