apiVersion: v2
# Generated by tools/ackgen from the ACK ResourceShare CRD (ram.services.k8s.aws).
#
# Renders a native ram.services.k8s.aws/v1alpha1 ResourceShare resource; the ACK ram
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRAMResourceshare (plural awsramresourceshares) in the composition.krateo.io group.
# The Composition spec mirrors the ACK ResourceShare spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-ram-resourceshare
description: A Krateo blueprint that provisions an AWS Ram ResourceShare via the AWS Controllers for Kubernetes (ACK) ram controller. Requires the ACK ram controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - aws
  - ram
  - resourceshare
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
