apiVersion: v2
# Generated by tools/ackgen from the ACK DBCluster CRD (rds.services.k8s.aws).
#
# Renders a native rds.services.k8s.aws/v1alpha1 DBCluster resource; the ACK rds
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRdsDbcluster (plural awsrdsdbclusters) in the composition.krateo.io group.
