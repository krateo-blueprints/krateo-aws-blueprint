apiVersion: v2
# Generated by tools/ackgen from the ACK GlobalCluster CRD (rds.services.k8s.aws).
#
# Renders a native rds.services.k8s.aws/v1alpha1 GlobalCluster resource; the ACK rds
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRdsGlobalcluster (plural awsrdsglobalclusters) in the composition.krateo.io group.
