name: aws-rds-globalcluster
description: A Krateo blueprint that provisions an AWS Rds GlobalCluster via the AWS Controllers for Kubernetes (ACK) rds controller. Requires the ACK rds controller and AWS credentials to be installed/configured beforehand (see repo docs).
