apiVersion: v2
# Generated by tools/ackgen from the ACK HostedZone CRD (route53.services.k8s.aws).
#
# Renders a native route53.services.k8s.aws/v1alpha1 HostedZone resource; the ACK route53
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRoute53Hostedzone (plural awsroute53hostedzones) in the composition.krateo.io group.
# The Composition spec mirrors the ACK HostedZone spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-route53-hostedzone
description: A Krateo blueprint that provisions an AWS Route53 HostedZone via the AWS Controllers for Kubernetes (ACK) route53 controller. Requires the ACK route53 controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://github.com/krateoplatformops/krateo/blob/main/docs/media/logo.svg"
keywords:
  - aws
  - route53
  - hostedzone
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
