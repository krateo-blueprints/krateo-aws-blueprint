apiVersion: v2
# Generated by tools/ackgen from the ACK RecordSet CRD (route53.services.k8s.aws).
#
# Renders a native route53.services.k8s.aws/v1alpha1 RecordSet resource; the ACK route53
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsRoute53Recordset (plural awsroute53recordsets) in the composition.krateo.io group.
# The Composition spec mirrors the ACK RecordSet spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-route53-recordset
description: A Krateo blueprint that provisions an AWS Route53 RecordSet via the AWS Controllers for Kubernetes (ACK) route53 controller. Requires the ACK route53 controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - route53
  - recordset
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateo.io/category: "network"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
