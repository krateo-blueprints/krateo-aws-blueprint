{{- /*
Renders a native ACK RecordSet custom resource from the Composition spec.

The Composition spec (.Values) mirrors the ACK RecordSet spec, so it passes through verbatim.
`region` is Krateo-wiring (not part of the ACK spec) and becomes the standard ACK region
annotation. Generated by tools/ackgen.
*/ -}}
apiVersion: route53.services.k8s.aws/v1alpha1
kind: RecordSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-route53-recordset.labels" . | nindent 4 }}
  {{- with .Values.region }}
  annotations:
    services.k8s.aws/region: {{ . | quote }}
  {{- end }}
{{- $spec := omit .Values "region" }}
{{- if $spec }}
spec:
{{ toYaml $spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}
