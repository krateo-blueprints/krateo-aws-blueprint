apiVersion: v1
data:
  drawer: "true"
  form: "true"
  showFormStructure: "true"
  drawerSize: large
kind: ConfigMap
metadata:
  name: template-aws-s3files-accesspoint-card
  namespace: aws-s3files-system
---
apiVersion: templates.krateo.io/v1alpha1
kind: Widget
metadata:
  name: template-aws-s3files-accesspoint-card
  namespace: aws-s3files-system
spec:
  actions:
  - template:
      apiVersion: templates.krateo.io/v1alpha1
      name: template-aws-s3files-accesspoint-customform
      namespace: aws-s3files-system
      resource: customforms
      verb: GET
  - template:
      apiVersion: core.krateo.io/v1alpha1
      name: aws-s3files-accesspoint
      namespace: aws-s3files-system
      resource: compositiondefinitions
      verb: DELETE
  app:
    template:
      color: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | if .status == "False" then "orange" elif .status == "True" then "green" else "grey" end }
      content: Provision an AWS S3files AccessPoint via the ACK s3files controller.
      icon: fa-brands fa-aws
      tags: aws-s3files-system,0.1.1
      title: aws-s3files-accesspoint
      status: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | "Ready:" + .status }
      date: ${ .getCompositionDefinition.metadata.creationTimestamp }
  propsRef:
    name: template-aws-s3files-accesspoint-card
    namespace: aws-s3files-system
  type: card
  api:
  - name: getCompositionDefinition
    path: "/apis/core.krateo.io/v1alpha1/namespaces/aws-s3files-system/compositiondefinitions/aws-s3files-accesspoint"
    verb: GET
    headers:
    - 'Accept: application/json'
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: template-aws-s3files-accesspoint-customform
  namespace: aws-s3files-system
data:
  onSubmitId: submit
  onSubmitVerb: POST
  payloadFormKey: spec
  redirectRoute: /compositions/${metadata.namespace}/${metadata.name}
  redirectTimeout: "50"
---
apiVersion: templates.krateo.io/v1alpha1
kind: CustomForm
metadata:
  name: template-aws-s3files-accesspoint-customform
  namespace: aws-s3files-system
spec:
  type: customform
  propsRef:
    name: template-aws-s3files-accesspoint-customform
    namespace: aws-s3files-system
  actions:
    - template:
        id: submit
        apiVersion: composition.krateo.io/v0-1-1
        verb: POST
        resource: awss3filesaccesspoints
        payloadToOverride:
        - name: metadata.namespace
          value: ${ "aws-s3files-system" }
  app:
    template:
      schema: ${ .getCRD | .spec.versions[] | select(.name == "v0-1-1") | .schema.openAPIV3Schema.properties.spec }
  api:
  - name: getCRD
    path: "/apis/apiextensions.k8s.io/v1/customresourcedefinitions/awss3filesaccesspoints.composition.krateo.io"
    verb: GET
    headers:
    - 'Accept: application/json'
