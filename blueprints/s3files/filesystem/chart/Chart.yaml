apiVersion: v2
# Generated by tools/ackgen from the ACK FileSystem CRD (s3files.services.k8s.aws).
#
# Renders a native s3files.services.k8s.aws/v1alpha1 FileSystem resource; the ACK s3files
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsS3filesFilesystem (plural awss3filesfilesystems) in the composition.krateo.io group.
# The Composition spec mirrors the ACK FileSystem spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-s3files-filesystem
description: A Krateo blueprint that provisions an AWS S3files FileSystem via the AWS Controllers for Kubernetes (ACK) s3files controller. Requires the ACK s3files controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - s3files
  - filesystem
  - ack
sources:
  - https://github.com/braghettos/krateo-aws-blueprint
annotations:
  krateo.io/category: "storage"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
