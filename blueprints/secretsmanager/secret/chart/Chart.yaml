apiVersion: v2
# Generated by tools/ackgen from the ACK Secret CRD (secretsmanager.services.k8s.aws).
#
# Renders a native secretsmanager.services.k8s.aws/v1alpha1 Secret resource; the ACK secretsmanager
# controller reconciles it into the real AWS resource.
#
# Composition Kind: AwsSecretsmanagerSecret (plural awssecretsmanagersecrets) in the composition.krateo.io group.
# The Composition spec mirrors the ACK Secret spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: aws-secretsmanager-secret
description: A Krateo blueprint that provisions an AWS Secretsmanager Secret via the AWS Controllers for Kubernetes (ACK) secretsmanager controller. Requires the ACK secretsmanager controller and AWS credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ACK CRD version this blueprint targets.
appVersion: "v1alpha1"

home: https://krateo.io
icon: "https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg"
keywords:
  - aws
  - secretsmanager
  - secret
  - ack
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
annotations:
  krateo.io/category: "security"
  krateo.io/maturity: "beta"
  krateoSupportedVersion: "2.7.0"
