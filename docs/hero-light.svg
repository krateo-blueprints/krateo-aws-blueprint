<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="Krateo loves AWS">
  <defs>
    <linearGradient id="krateo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5F"/>
      <stop offset="1" stop-color="#E0245E"/>
    </linearGradient>
  </defs>

  <!-- Krateo wordmark -->
  <text x="44" y="138" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-1" fill="url(#krateo)">Krateo</text>

  <!-- Heart -->
  <g transform="translate(388,66) scale(0.92)">
    <path d="M50 88 C50 88 6 58 6 30 C6 13 18 4 31 4 C40 4 47 9 50 16 C53 9 60 4 69 4 C82 4 94 13 94 30 C94 58 50 88 50 88 Z"
          fill="url(#heart)"/>
  </g>

  <!-- AWS wordmark -->
  <text x="556" y="126" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="78" font-weight="800" letter-spacing="-2" fill="#232F3E">aws</text>
  <!-- AWS smile -->
  <path d="M560 156 Q638 196 716 156" fill="none" stroke="#FF9900" stroke-width="11" stroke-linecap="round"/>
  <path d="M716 156 l-2 -19 l19 9 Z" fill="#FF9900"/>

  <!-- subtitle -->
  <text x="410" y="214" text-anchor="middle"
        font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="22" font-weight="600" fill="#64748B" letter-spacing="2">SELF-SERVICE AWS RESOURCES, THE KRATEO WAY</text>
</svg>
