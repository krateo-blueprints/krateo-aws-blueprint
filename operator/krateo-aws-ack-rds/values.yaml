# Values forwarded to the upstream rds-chart chart. Only the knobs a Krateo Composition needs
# are surfaced; everything else keeps the upstream default.
#
# Nothing here is REQUIRED at the schema's root. A root-level `required` in a blueprint chart's
# values.schema.json becomes a mandatory field on every Composition CR of this type, and the
# installer emits a Composition carrying only the componentValues it was hand-given — so a missing
# key is rejected by the apiserver INSIDE the Installer composition's own reconcile, which stalls
# every other component behind it. Defaults live here instead.
#
# GENERATED by tools/ackgen. Do not hand-edit.
ack:
  aws:
    # Default AWS region for this controller's API calls. Leave empty and set `region` per
    # Composition instead: every blueprint in this repo renders its `region` onto the ACK resource
    # as the services.k8s.aws/region annotation, which overrides this. Empty here with no
    # per-resource region means the controller has no region at all and resources fail to reconcile.
    region: ""

    # Non-default endpoints, for FIPS, VPC endpoints or localstack. Leave empty for the public
    # AWS endpoints.
    endpoint_url: ""

    credentials:
      # Secret holding a shared AWS credentials file. Leave empty when using IRSA / Pod Identity,
      # which is the normal path on EKS — wire the role through serviceAccount.annotations below
      # and the controller takes its identity from the projected token instead of a Secret.
      secretName: ""
      # Key inside that Secret whose value is the credentials file.
      secretKey: "credentials"
      # Profile to select from the credentials file.
      profile: "default"

  serviceAccount:
    create: true
    # IRSA / EKS Pod Identity is wired here, e.g.
    #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
    # This is the credential path to prefer: no secret material enters the cluster.
    annotations: {}

  # "cluster" watches every namespace; "namespace" restricts the controller to watchNamespace.
  installScope: cluster
  # Only read when installScope is "namespace". Empty means the release namespace.
  watchNamespace: ""

  # What happens to the AWS resource when its Kubernetes resource is deleted. "delete" destroys the
  # real cloud resource; "retain" orphans it and leaves it running (and billable). Surfaced here
  # BECAUSE it is destructive and the upstream default is `delete` — an operator should be able to
  # see and change it without reading the upstream chart.
  deletionPolicy: delete

  log:
    # one of: debug, info, warn, error
    level: info
