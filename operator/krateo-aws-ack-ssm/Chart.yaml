apiVersion: v2
# The ACK service controller for AWS Ssm, the controller that reconciles every
# blueprints/ssm/* resource in this repo.
#
# A DEPENDENCY WRAPPER over the UNFORKED upstream chart, not a repackage: AWS publishes an official
# Helm chart per service, so there is nothing to vendor. Contrast krateo-gcp-configconnector, which
# repackages a YAML bundle only because Config Connector ships no chart.
#
# The upstream chart ships its service CRDs in its own crds/ directory, so helm installs them with
# the controller and there is NO companion -crds chart here — same as krateo-azure-aso, where ASO
# installs its resource CRDs at runtime.
#
# GENERATED by tools/ackgen from tools/ackgen/ack-controllers.yaml. Do not hand-edit: bump the
# version in that file and re-run the generator. operators_test.go fails CI on a hand-edit.
name: krateo-aws-ack-ssm
description: The AWS Controllers for Kubernetes (ACK) Ssm service controller, for provisioning AWS Ssm resources from Krateo Compositions.
type: application
version: CHART_VERSION
appVersion: "1.7.1"
home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - aws
  - ack
  - ssm
  - operator
sources:
  - https://github.com/krateo-blueprints/krateo-aws-blueprint
dependencies:
  # `name` must be the UPSTREAM chart's own metadata.name (ssm-chart), which is how helm
  # resolves it under the OCI repository. `alias` is what makes the values key uniform across every
  # wrapper in this catalogue — see the depAlias note in tools/ackgen/operators.go.
  - name: ssm-chart
    alias: ack
    version: "1.7.1"
    repository: oci://public.ecr.aws/aws-controllers-k8s
annotations:
  krateoSupportedVersion: "2.7.0"
