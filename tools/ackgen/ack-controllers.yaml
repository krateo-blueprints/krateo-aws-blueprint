# Pinned ACK service-controller chart versions — the INPUT OF RECORD for the operator/ wrappers.
#
# Every entry maps an AWS service to the upstream chart version its wrapper depends on. The
# wrappers under operator/ are GENERATED from this file:
#
#   cd tools/ackgen
#   go build -o ackgen .
#   ./ackgen -operators ack-controllers.yaml -out ../../operator
#
# Why a committed pin list rather than resolving "latest" at generation time: the generator must be
# deterministic. A floating resolve means two runs a day apart produce different Chart.yaml bytes,
# which makes a regeneration diff unreviewable and makes "did the generator change, or did upstream?"
# unanswerable. The azure and gcp catalogues already pin their operator input (ASO 2.21.1 with a
# committed Chart.lock; Config Connector 1.158.0); this is the same discipline for AWS.
#
# To bump a controller: change its version here, re-run the generator, and commit the regenerated
# wrapper. operators_test.go asserts every committed wrapper matches this file, so a hand-edited
# Chart.yaml fails CI.
#
# Resolved against oci://public.ecr.aws/aws-controllers-k8s/<service>-chart on 2026-10-13.
#
# NOT LISTED: networkmanager. blueprints/networkmanager/globalnetwork renders
# networkmanager.services.k8s.aws/v1alpha1 resources, but AWS publishes no
# networkmanager-chart — `helm show chart` returns a hard 404 ("The repository with name
# 'networkmanager-chart' does not exist in the registry with id 'aws-controllers-k8s'"), reproduced
# on three separate attempts. That blueprint therefore has no controller that can reconcile it. It is
# left out deliberately rather than pinned to a guess; see docs/installing-controllers.md.
